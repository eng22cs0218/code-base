# Development environment values for alerting-service
# This file configures the backend-service chart specifically for alerting service

service:
  # Service alerting
  name: "wallpaper-service"
  appName: "wallpaper-app"
  namespace: "wallpaper-ns"
  
  # Container Configuration
  image:
    repository: "aayush2703/wallpaper-service"
    tag: "latest"              # Service-specific tag
    pullPolicy: Always          # Always pull for dev environment
  
  # Port Configuration
  containerPort: 8081           # Port exposed in Dockerfile
  servicePort: 80               # Standard service port
  # Service Annotations (enable Prometheus scraping via dynamic job)
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/metrics"
    prometheus.io/scheme: "http"
  
  # Health Check Configuration
  healthCheck:
    livenessPath: "/health"     # wallpaper service health endpoint
    readinessPath: "/health"    # Same for readiness
  
  # Resource Configuration (from your manifest)
  resources:
    requests:
      memory: "10Mi"           # Specific to wallpaper service
      cpu: "10m"               # Specific to wallpaper service
    limits:
      memory: "100Mi"          # Specific to wallpaper service
      cpu: "100m"               # Specific to wallpaper service
  
  # Dev environment specific settings
  replicaCount: 1               # Single replica for dev
  
  # Faster health checks for development
  livenessProbe:
    enabled: true
    initialDelaySeconds: 90     # Faster for dev
    periodSeconds: 30            # More frequent for dev
    timeoutSeconds: 5
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 90      # Faster for dev
    periodSeconds: 30            # More frequent for dev
    timeoutSeconds: 5

   