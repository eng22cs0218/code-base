# Default values for frontend chart
# These are the base values that can be overridden by environment-specific values

# Global settings
global:
  namespace: frontend-ns

# Frontend Application Configuration
frontend:
  enabled: true
  replicaCount: 1
  revisionHistoryLimit: 1
  
  image:
    repository: "aayush2703/frontend"
    tag: "latest"
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
    name: frontend-svc
  
  resources:
    requests:
      memory: "20Mi"
      cpu: "50m"
    limits:
      memory: "20Mi"
      cpu: "50m"
  
  # Health checks
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
  
  # Init container configuration
  initContainer:
    enabled: true
    image: busybox
    command: ['sh', '-c', 'echo Init Container; sleep 5']
  
  # Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  
  # Labels and metadata
  labels:
    tier: frontend
    version: "1.1.0.0"

  # Node affinity configuration
  # affinity: {}

  # Tolerations configuration
  # tolerations: []

# Nginx Reverse Proxy Configuration
nginx:
  enabled: true
  replicaCount: 1

  image:
    repository: nginx
    tag: "latest"
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    name: nginx-service
  
  resources:
    requests:
      cpu: "20m"
      memory: "10Mi"
    limits:
      cpu: "100m"
      memory: "200Mi"
  
  # Node affinity configuration
  # affinity: {}

  # Tolerations configuration
  # tolerations: []
  # Upstream services configuration

# HTTPRoute Configuration
httproute:
  enabled: true
  # Gateway API configuration
  gateway:
    name: prod-gateway
    namespace: infra
    # Single listener (use sectionName)
    sectionName: prod-http  # References the listener name in gateway.yaml
    # Multiple listeners (use sectionNames) - for HTTP + HTTPS
    # sectionNames:
    #   - prod-http
    #   - https
  hosts:
    - host: prod.opsolute.io
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-svc
              port: 80